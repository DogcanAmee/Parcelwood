<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcelwood</title>
<meta name="theme-color" content="#2456c4">
<link rel="icon" href="./icons/icon-192.png">
<!--CRAZYGAMES_SDK-->
<style>
  /* Inline loading screen: first paint is branded, not white, even while the SDK starts. */
  #cg-loading { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #2456c4; color: #fffaf0; font-family: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; }
  #cg-loading .cg-logo { font-size: clamp(34px, 7vw, 58px); letter-spacing: .02em; line-height: 1; text-shadow: 0 3px 0 #173a8a; }
  #cg-loading .cg-sub { font-family: "Courier Prime", "Courier New", monospace; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; opacity: .9; }
  #cg-loading .cg-spinner { width: 42px; height: 42px; border-radius: 50%; border: 5px solid rgba(255,250,240,.35); border-top-color: #ffd66e; animation: cgSpin .85s linear infinite; }
  #cg-loading .cg-box { position: absolute; width: 74px; height: 74px; border-radius: 12px; background: #c99a62; border: 4px solid #3a2c1f; box-shadow: 0 6px 0 #7d4a24; transform: rotate(-6deg); opacity: .18; }
  #cg-loading .cg-box::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 16%; transform: translateX(-50%); background: #e9d7a8; }
  #cg-loading.cg-loading-done { opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility .18s; }
  @keyframes cgSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #cg-loading .cg-spinner { animation-duration: 2.4s; } }
</style>
</head>
<body>
<div id="cg-loading" role="status" aria-live="polite" aria-label="Loading Parcelwood">
  <div class="cg-box" aria-hidden="true"></div>
  <div class="cg-logo" aria-hidden="true">Parcelwood</div>
  <div class="cg-sub" aria-hidden="true">Sorting the morning post</div>
  <div class="cg-spinner" aria-hidden="true"></div>
</div>
<div class="app" id="app"></div>
<nav class="nav" aria-label="Main">
  <div class="nav-in" id="nav-in"></div>
</nav>
<div id="sheet-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="ad-root"></div>
<script type="module" src="../src/crazygames/main.ts"></script>
</body>
</html>
