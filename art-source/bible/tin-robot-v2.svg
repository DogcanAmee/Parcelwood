<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <!-- Parcelwood art bible v0.1 anchor: tin robot. Light upper-left, outline #3a2c1f, max 3 tones per color, no cast shadow. -->
  <g stroke="#3a2c1f" stroke-linejoin="round" stroke-linecap="round" transform="translate(100 100) scale(1.08) translate(-100 -98)">

    <!-- wind-up key (behind body, sticking out of the back/right side) -->
    <g stroke-width="3">
      <rect x="134" y="110" width="20" height="9" rx="3" fill="#b9862a"/>
      <circle cx="160" cy="104" r="9" fill="#e8b33f"/>
      <circle cx="160" cy="125" r="9" fill="#e8b33f"/>
      <rect x="153" y="108" width="12" height="13" rx="4" fill="#e8b33f"/>
    </g>
    <g stroke-width="1.6">
      <circle cx="160" cy="104" r="3" fill="#b9862a"/>
      <circle cx="160" cy="125" r="3" fill="#b9862a"/>
    </g>
    <path d="M155 100 a7 7 0 0 1 6 -4" stroke="#ffe08a" stroke-width="2.4" fill="none"/>

    <!-- antenna -->
    <rect x="94" y="16" width="5" height="16" fill="#b9862a" stroke-width="2.4"/>
    <circle cx="96.5" cy="15" r="7.5" fill="#c8402f" stroke-width="3"/>
    <circle cx="94" cy="12.5" r="2.2" fill="#fffaf0" stroke="none"/>

    <!-- ears -->
    <rect x="54" y="48" width="10" height="20" rx="4" fill="#c8402f" stroke-width="3"/>

    <!-- head: side, top, front -->
    <path d="M120 34 L134 27 L134 72 L120 80 Z" fill="#23a091" stroke-width="3"/>
    <path d="M62 34 L76 27 L134 27 L120 34 Z" fill="#b5e2db" stroke-width="3"/>
    <rect x="62" y="34" width="58" height="46" rx="5" fill="#7cc7bd" stroke-width="3"/>
    <path d="M65 74 H117 V75 a5 5 0 0 1 -5 5 H70 a5 5 0 0 1 -5 -5 Z" fill="#5fb3a8" stroke="none"/>
    <rect x="67" y="38" width="14" height="4" rx="2" fill="#fffaf0" stroke="none" opacity=".9"/>
    <rect x="125" y="44" width="6" height="16" rx="3" fill="#c8402f" stroke-width="2.4"/>

    <!-- eyes, looking left -->
    <g stroke-width="2.4">
      <circle cx="79" cy="53" r="9" fill="#fffaf0"/>
      <circle cx="104" cy="53" r="9" fill="#fffaf0"/>
    </g>
    <circle cx="76.5" cy="54" r="4" fill="#3a2c1f" stroke="none"/>
    <circle cx="101.5" cy="54" r="4" fill="#3a2c1f" stroke="none"/>
    <circle cx="75" cy="52.5" r="1.3" fill="#fffaf0" stroke="none"/>
    <circle cx="100" cy="52.5" r="1.3" fill="#fffaf0" stroke="none"/>

    <!-- mouth grille -->
    <rect x="80" y="66" width="22" height="8" rx="2" fill="#efe3c8" stroke-width="2"/>
    <path d="M86 66 V74 M91 66 V74 M96 66 V74" stroke-width="1.4"/>

    <!-- neck -->
    <rect x="84" y="79" width="18" height="9" fill="#b9862a" stroke-width="2.4"/>

    <!-- near arm (tucked behind the body edge) -->
    <rect x="43" y="94" width="13" height="36" rx="6.5" fill="#7cc7bd" stroke-width="3"/>
    <path d="M51.5 140 A6.5 6.5 0 1 0 44.5 140" fill="none" stroke="#3a2c1f" stroke-width="10" stroke-linecap="round"/>
    <path d="M51.5 140 A6.5 6.5 0 1 0 44.5 140" fill="none" stroke="#e8b33f" stroke-width="4.4" stroke-linecap="round"/>

    <!-- body: side, top, front -->
    <path d="M124 87 L141 80 L141 140 L124 148 Z" fill="#23a091" stroke-width="3"/>
    <path d="M54 87 L71 80 L141 80 L124 87 Z" fill="#b5e2db" stroke-width="3"/>
    <rect x="54" y="87" width="70" height="61" rx="7" fill="#7cc7bd" stroke-width="3"/>
    <path d="M57 139 H121 V141 a7 7 0 0 1 -7 7 H64 a7 7 0 0 1 -7 -7 Z" fill="#5fb3a8" stroke="none"/>
    <rect x="60" y="91" width="18" height="4" rx="2" fill="#fffaf0" stroke="none" opacity=".9"/>
    <path d="M58 99 V128" stroke="#fffaf0" stroke-width="2" opacity=".55"/>

    <!-- far arm (on the side face) -->
    <rect x="128" y="93" width="10" height="31" rx="5" fill="#23a091" stroke-width="2.8"/>
    <path d="M136 133.5 A5.5 5.5 0 1 0 130 133.5" fill="none" stroke="#3a2c1f" stroke-width="9" stroke-linecap="round"/>
    <path d="M136 133.5 A5.5 5.5 0 1 0 130 133.5" fill="none" stroke="#b9862a" stroke-width="3.8" stroke-linecap="round"/>

    <!-- rivets -->
    <g fill="#5fb3a8" stroke-width="1.4">
      <circle cx="60" cy="93" r="1.8"/><circle cx="118" cy="93" r="1.8"/>
      <circle cx="68" cy="40" r="1.6"/><circle cx="114" cy="40" r="1.6"/>
    </g>

    <!-- chest gauge: ticks only -->
    <circle cx="89" cy="109" r="15" fill="#e8b33f" stroke-width="3"/>
    <circle cx="89" cy="109" r="11" fill="#fffaf0" stroke-width="1.6"/>
    <path d="M89 100 V102.5 M98 109 H95.5 M80 109 H82.5 M95.4 102.6 L93.6 104.4 M82.6 102.6 L84.4 104.4" stroke-width="1.4"/>
    <path d="M89 109 L83.5 103.5" stroke="#c8402f" stroke-width="2.2"/>
    <circle cx="89" cy="109" r="2" fill="#3a2c1f" stroke="none"/>
    <path d="M80 102 a12 12 0 0 1 5 -4" stroke="#ffe08a" stroke-width="2" fill="none"/>

    <!-- buttons -->
    <g stroke-width="2.2">
      <circle cx="75" cy="135" r="5" fill="#c8402f"/>
      <circle cx="89" cy="135" r="5" fill="#e8b33f"/>
      <circle cx="103" cy="135" r="5" fill="#23a091"/>
    </g>
    <g fill="#fffaf0" stroke="none">
      <circle cx="73.5" cy="133.5" r="1.3"/><circle cx="87.5" cy="133.5" r="1.3"/><circle cx="101.5" cy="133.5" r="1.3"/>
    </g>

    <!-- legs -->
    <g stroke-width="2.6">
      <rect x="68" y="147" width="15" height="10" fill="#23a091"/>
      <rect x="97" y="147" width="15" height="10" fill="#23a091"/>
    </g>

    <!-- feet -->
    <g stroke-width="3">
      <path d="M58 172 V163 a8 8 0 0 1 8 -8 H86 a6 6 0 0 1 6 6 V172 Z" fill="#c8402f"/>
      <path d="M92 172 V161 a6 6 0 0 1 6 -6 H113 a8 8 0 0 1 8 8 L126 158 V168 L121 172 Z" fill="#c8402f"/>
      <path d="M121 163 L126 158 V168 L121 172 Z" fill="#9c2f22"/>
    </g>
    <g fill="#e0634f" stroke="none">
      <rect x="63" y="158" width="16" height="3.5" rx="1.75"/>
      <rect x="96" y="158" width="14" height="3.5" rx="1.75"/>
    </g>
  </g>
</svg>
