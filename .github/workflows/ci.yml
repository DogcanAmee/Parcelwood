name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install (from lockfile)
        run: npm ci

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Typecheck (Discord)
        run: npm run typecheck:discord

      - name: Tests
        run: npx vitest run

      # The builds need no secrets: with VITE_* vars unset the Discord and
      # CrazyGames targets fall back to local mock mode and still bundle.
      - name: Build (web)
        run: npm run build

      - name: Build (Discord)
        run: npm run build:discord

      - name: Build (CrazyGames)
        run: npm run build:crazygames

      - name: Release check
        run: npm run check:release
